<!-- 锁屏时钟内联兜底（2026-11-26）：不依赖 js/00（8.1MB）先到；js/00 的 TimeEngine 跑起来后写相同的值接管，重复写无害 -->
<script id="xwl-early-clock">
(function(){
  var DAYS=['周日','周一','周二','周三','周四','周五','周六'];
  function tick(){
    try{
      var now=new Date();
      var t=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
      var st=document.getElementById('sys-status-time'); if(st) st.textContent=t;
      var lt=document.getElementById('sys-lock-time'); if(lt) lt.textContent=t;
      var ld=document.getElementById('sys-lock-date');
      if(ld) ld.textContent=(now.getMonth()+1)+'月'+now.getDate()+'日 '+DAYS[now.getDay()];
    }catch(e){}
  }
  tick();
  setInterval(tick,1000);
})();
</script>

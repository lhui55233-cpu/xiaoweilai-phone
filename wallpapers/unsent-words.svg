    <path d="M48 341h294" stroke="#cdbb9d" stroke-opacity=".5"/>
    <text x="58" y="367" fill="#8a7969" font-family="Georgia,serif" font-size="9" letter-spacing="3">A LETTER LEFT UNSENT</text>
    <path d="M58 384h56" stroke="#a89171" stroke-width="1.2"/>
    <text x="58" y="430" fill="#3d3a3a" font-family="Noto Serif SC, Songti SC, serif" font-size="24" letter-spacing="1.2">无法显现的文字</text>
    <text x="59" y="475" fill="#6c6056" font-family="LXGW WenKai, Kaiti SC, serif" font-size="15">有些话不是没有说出口，</text>
    <text x="59" y="507" fill="#6c6056" font-family="LXGW WenKai, Kaiti SC, serif" font-size="15">只是一直停…</text>

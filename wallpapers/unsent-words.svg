<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">未寄的字</title><desc id="desc">深暮色背景上的纸笺与未寄出的信。</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#242633"/><stop offset=".48" stop-color="#41414f"/><stop offset="1" stop-color="#69747d"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#c6a98e" stop-opacity=".34"/><stop offset="1" stop-color="#c6a98e" stop-opacity="0"/></radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#fbf5e9"/><stop offset="1" stop-color="#e7dac3"/></linearGradient>
    <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5"><feDropShadow dx="0" dy="15" stdDeviation="17" flood-color="#151720" flood-opacity=".42"/></filter>
    <pattern id="grain" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="4" cy="9" r=".7" fill="#fff" opacity=".12"/><circle cx="25" cy="27" r=".55" fill="#fff" opacity=".1"/><path d="M14 2v4M31 14v3" stroke="#fff" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="390" height="844" fill="url(#night)"/><rect width="390" height="844" fill="url(#glow)"/><rect width="390" height="844" fill="url(#grain)"/>
  <circle cx="329" cy="193" r="81" fill="#d9c6aa" opacity=".07"/><circle cx="329" cy="193" r="58" fill="none" stroke="#e5d6bf" stroke-opacity=".2"/>
  <path d="M0 286c55-28 111-24 160 2s112 28 230-10v122H0Z" fill="#171b29" opacity=".18"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">雨落字间</title><desc id="desc">雨夜窗前的手写字笺，背景含静态细雨。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#222b3b"/><stop offset=".5" stop-color="#3d4d60"/><stop offset="1" stop-color="#77838c"/></linearGradient>
    <radialGradient id="lamp"><stop stop-color="#d2b995" stop-opacity=".27"/><stop offset="1" stop-color="#d2b995" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b9c9cf" stop-opacity=".12"/><stop offset="1" stop-color="#dce5e4" stop-opacity=".04"/></linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f1e4"/><stop offset="1" stop-color="#e6ddcd"/></linearGradient>
    <filter id="soft" x="-.2" y="-.2" width="1.4" height="1.5"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#17202d" flood-opacity=".4"/></filter>
    <pattern id="rain" width="48" height="78" patternUnits="userSpaceOnUse" patternTransform="skewX(-12)"><path d="M7 4v19M31 34v23M43 10v12M17 61v13" stroke="#d9e4e6" stroke-opacity=".19" stroke-width="1.2" stroke-linecap="round"/><circle cx="25" cy="15" r="1.1" fill="#d9e4e6" opacity=".24"/></pattern>
  </defs>
  <rect width="390" height="844" fill="url(#sky)"/><rect width="390" height="844" fill="url(#lamp)"/>
  <g opacity=".72" stroke="#a9bbc5" stroke-width="1">
    <path d="M24 274V89h342v198" fill="url(#glass)"/>
    <path d="M193 90v183M24 185h342" stroke-opacity=".35"/>
    <path d="M48 104v35m54-42v54m85-48v28m75-40v51m70-36v35M74 206v40m96-51v37m87-29v49m83-57v35" stroke-linecap="round" stroke-opacity=".48"/>
  </g>
  <rect x="24" y="89" width="342" height="198" fill="url(#rain)" opacity=".72"/>
  <path d="M0 285c47-20 94-15 146 4 62 24 123 21 244-15v191H0Z" fill="#1c2734" opacity=".31"/>
  <g filter="url(#soft)">
    <path d="M44 352q12-10 25 0h252q15 0 20 14v289q-9 14-23 12H62q-18 2-20-13Z" fill="url(#sheet)" stroke="#d7cbb9" stroke-width="1.2"/>
    <path d="M68 367v277" stroke="#c8b89e" stroke-opacity=".58"/>
    <path d="M82 389h226" stroke="#b9a991" stroke-opacity=".5"/>
    <text x="84" y="379" fill="#82796e" font-family="Georgia,serif" font-size="9" letter-spacing="2.6">RAIN BETWEEN THE LINES</text>
    <text x="84" y="431" fill="#35404b" font-family="Noto Serif SC, Songti SC, serif" font-size="21" letter-spacing=".7">雨落碎了字里行间</text>
    <path d="M84 448h72" stroke="#9c8770" stroke-width="1.1"/>
    <text x="85" y="493" fill="#5b6266" font-family="LXGW WenKai, Kaiti SC, serif" font-size="14">我把想你藏在字里行间，</text>
    <text x="85" y="525" fill="#5b6266" font-family="LXGW WenKai, Kaiti SC, serif" font-size="14">可雨一…</text>
    <path d="M84 562h218M84 582h193M84 602h208" stroke="#a99e8e" stroke-opacity=".34" stroke-width="1" stroke-dasharray="1 5"/>
    <path d="M281 616c4-12 13-15 20-7 7-8 17-5 20 7-1 13-20 23-20 23s-19-10-20-23Z" fill="none" stroke="#a47f7c" stroke-width="1.2" opacity=".67"/>
  </g>
  <path d="M15 705c84-31 155-19 223 8 53 20 100 17 151-4v135H0Z" fill="#18232f" opacity=".2"/>
  <g fill="none" stroke="#d6e1e4" stroke-linecap="round" opacity=".34">
    <path d="M47 695v42m66-19v51m83-43v39m81-65v44m62-15v52"/>
  </g>
</svg>
